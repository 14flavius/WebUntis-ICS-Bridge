services:
  bridge:
    image: ${BRIDGE_IMAGE:-ghcr.io/14flavius/webuntis-ics-bridge:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_PATH: /app/data/bridge.sqlite
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env first}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a permanent BETTER_AUTH_SECRET in .env first}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set a permanent ENCRYPTION_KEY in .env first}
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '3'
